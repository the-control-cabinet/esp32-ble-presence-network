# The four ESP32 board profiles used in this network (snippets, not complete files).

# --- A. Active-connection proxy (one per floor) ---------------------------------
# Connects to BLE devices on HA's behalf (e.g. appliances that need GATT reads).
esp32_ble:
  io_capability: none
  max_notifications: 30
  max_connections: 4
bluetooth_proxy:
  active: true

# --- B. Passive proxy + discovery logger (all other room boards) -----------------
# Forwards advertisements only (Bermuda presence still works); runs the scanner.
bluetooth_proxy:
  active: false
# + config/ble-scanner-dedup.yaml

# --- C. Lean monitoring board (plant / metering boards) ---------------------------
# Plant or metering is the primary job: passive proxy, passive scanning, no scanner, no MQTT.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false
bluetooth_proxy:
  active: false

# --- Common to all boards ---------------------------------------------------------
logger:
  level: INFO               # DEBUG logging adds load
debug:
  update_interval: 10s
sensor:
  - platform: debug
    free:
      name: "<Board> Heap Free"
    block:
      name: "<Board> Heap Max Block"
    loop_time:
      name: "<Board> Loop Time"
wifi:
  ap:
    password: !secret fallback_ap_password   # one shared fallback secret across the fleet
captive_portal:
